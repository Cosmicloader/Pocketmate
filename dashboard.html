<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PocketMate Dashboard</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/polish.css" />
      <script src="js/pm-core.js"></script>
  </head>
  <body class="page-dashboard">
    <div class="app">
      <aside class="sidebar">
        <div class="logo">
          <img
            src="assets/images/logo.png"
            alt="PocketMate Logo"
            onerror="
              this.src = 'https://via.placeholder.com/45/6C4EF6/FFFFFF?text=PM'
            "
          />
          <h2>PocketMate</h2>
        </div>
        <nav class="navigation">
          <a class="nav-item active" href="dashboard.html"
            ><span class="nav-icon"><i class="ph ph-squares-four"></i></span
            ><span>Dashboard</span></a
          ><a class="nav-item" href="expensemanager.html"
            ><span class="nav-icon"><i class="ph ph-wallet"></i></span
            ><span>Expense Manager</span></a
          ><a class="nav-item" href="reports.html"
            ><span class="nav-icon"><i class="ph ph-chart-pie-slice"></i></span
            ><span>Reports</span></a
          ><a class="nav-item" href="settings.html"
            ><span class="nav-icon"><i class="ph ph-gear"></i></span
            ><span>Settings</span></a
          ><a class="nav-item logout" href="homepage.html"
            ><span class="nav-icon"><i class="ph ph-sign-out"></i></span
            ><span>Logout</span></a
          >
        </nav>
      </aside>
      <main class="main" id="app"></main>
    </div>
    <script src="js/dashboard.js"></script>
    <script>document.addEventListener("click",function(e){var r=e.target.closest(".transaction");if(r&&matchMedia("(hover:none)").matches)r.classList.toggle("open")})</script>
  </body>
</html>
