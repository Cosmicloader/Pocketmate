<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PocketMate</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/polish.css" />
      <script src="js/pm-core.js"></script>
  </head>
  <body class="page-index">
    <main class="loading-screen">
      <img class="loading-background" src="assets/images/loading.png" alt="" />
      <section class="loading-container">
        <div class="logo">
          <img
            src="assets/images/logo.png"
            alt="PocketMate Logo"
            onerror="
              this.src = 'https://via.placeholder.com/72/6C4EF6/FFFFFF?text=PM'
            "
          />
        </div>
        <h1 class="site-name">PocketMate</h1>
        <div class="loading-bar">
          <div class="loading-progress"></div>
        </div>
        <p class="loading-text">Loading your finances...</p>
      </section>
    </main>
    <script>
      var go=function(){location.href=PM.session()?"dashboard.html":"homepage.html"};
      PM.ready.then(function(){setTimeout(go,5000)});
      document.addEventListener("click",go);
    </script>
  </body>
</html>
